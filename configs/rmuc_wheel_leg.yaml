# RMUC wheel-leg asset/task configuration.
# The USD files in this repository are immutable source assets. This file only
# configures Isaac Lab's spawn/command interface; it does not rewrite USD
# meshes, masses, inertias, joint axes, limits, or authored drives.
run_mode: sim_training

robot:
  usd_path: source/agent_world/agent_world/assets/usd_files/rmuc_wheel_leg/rmuc_robot_closed_loop.usd
  open_chain_usd_path: source/agent_world/agent_world/assets/usd_files/rmuc_wheel_leg/rmuc_robot_only.usd
  # The prepared standalone robot uses /rm_train_ground/robot.  The validator
  # also reports the authored path so a differently composed USD is caught.
  articulation_root_prim: /rm_train_ground/robot
  root_link_name: robot
  body_names:
    base: robot
    wheels: [left_wheel, right_wheel]
    leg_reference: [left_active_link, right_active_link]
  dof_names:
    - left_active_link_pitch
    - left_long_link_pitch
    - left_node_link_pitch
    - left_parallel_link_pitch
    - left_hip_pitch
    - left_knee_pitch
    - left_wheel_spin
    - right_active_link_pitch
    - right_long_link_pitch
    - right_node_link_pitch
    - right_parallel_link_pitch
    - right_hip_pitch
    - right_knee_pitch
    - right_wheel_spin
  controlled_dof_names:
    - right_active_link_pitch
    - right_hip_pitch
    - right_wheel_spin
    - left_active_link_pitch
    - left_hip_pitch
    - left_wheel_spin
  passive_dof_names:
    - left_long_link_pitch
    - left_node_link_pitch
    - left_parallel_link_pitch
    - left_knee_pitch
    - right_long_link_pitch
    - right_node_link_pitch
    - right_parallel_link_pitch
    - right_knee_pitch
  # This V14-aligned standing pose is applied at reset. It is a command-layer
  # initial state and does not alter authored USD geometry or hardware values.
  # XML zero-joint high-standing pose: wheel centers are about 0.06 m,
  # The authored chassis/root origin is z=0.40 m while wheel centers are
  # z~=0.06 m and the wheel collision reaches the ground.
  initial_pos_z_m: 0.40
  # The stage is Z-up, but every authored rigid-body frame (including root)
  # carries +90 deg about X. Preserve that root-link orientation on reset.
  asset_frame_rpy_deg: [90.0, 0.0, 0.0]
  initial_joint_pos: {".*": 0.0}
  standing_joint_pos_profile: {".*": 0.0}

  # Explicit actuator/solver settings override authored USD drive parameters.
  # USD geometry stays unchanged; reference values are not hardware calibration.
  actuators:
    leg:
      joint_names: [right_active_link_pitch, right_hip_pitch, left_active_link_pitch, left_hip_pitch]
      stiffness: 60.0
      damping: 2.0
      effort_limit_nm: 40.0
      # DM-J8009P-2EC, 9:1 (user confirmed). 17 is a provisional
      # joint-side V14 reference, not a measured torque-speed envelope.
      velocity_limit_rad_s: 17.0
      velocity_limit_sim_rad_s: 17.0
      # Explicitly preserve the previously inherited USD armature.
      armature_kg_m2: 0.010
    wheel:
      joint_names: [right_wheel_spin, left_wheel_spin]
      stiffness: 0.0
      # Preserve the effective damping used by every existing stand/command
      # checkpoint. The USD's authored 0.25 drive damping is cleared by the
      # explicit actuator, so there is no duplicate damping. The XML's 0.01
      # mechanical damping is a future sim-to-real retraining target, not a
      # compatible drop-in change for the current policy lineage.
      damping: 0.1
      effort_limit_nm: 5.5
      velocity_limit_rad_s: 63.3734
    passive:
      # V14 legs_inact equivalent for the eight closed-loop linkage joints.
      joint_names:
        - left_long_link_pitch
        - left_node_link_pitch
        - left_parallel_link_pitch
        - left_knee_pitch
        - right_long_link_pitch
        - right_node_link_pitch
        - right_parallel_link_pitch
        - right_knee_pitch
      stiffness: 0.0
      damping: 0.01
      effort_limit_nm: 50.0
      velocity_limit_rad_s: 300.0
    guide_wheels:
      # Passive rolling bodies: no policy torque and no artificial damping.
      joint_names:
        - guide_wheel_lower_right_01_spin
        - guide_wheel_lower_right_02_spin
        - guide_wheel_lower_right_03_spin
        - guide_wheel_lower_right_04_spin
        - guide_wheel_lower_right_05_spin
        - guide_wheel_lower_right_06_spin
        - guide_wheel_lower_right_07_spin
        - guide_wheel_lower_right_08_spin
        - guide_wheel_lower_right_09_spin
        - guide_wheel_lower_right_10_spin
        - guide_wheel_lower_right_11_spin
        - guide_wheel_lower_right_12_spin
        - guide_wheel_lower_left_01_spin
        - guide_wheel_lower_left_02_spin
        - guide_wheel_lower_left_03_spin
        - guide_wheel_lower_left_04_spin
        - guide_wheel_lower_left_05_spin
        - guide_wheel_lower_left_06_spin
        - guide_wheel_lower_left_07_spin
        - guide_wheel_lower_left_08_spin
        - guide_wheel_lower_left_09_spin
        - guide_wheel_lower_left_10_spin
        - guide_wheel_lower_left_11_spin
        - guide_wheel_lower_left_12_spin
      stiffness: 0.0
      damping: 0.0
      effort_limit_nm: 0.0
      velocity_limit_rad_s: 300.0

  articulation:
    fix_root_link: false
    enabled_self_collisions: false
    solver_position_iteration_count: 12
    solver_velocity_iteration_count: 6

environment:
  seed: 42
  num_envs: 128
  env_spacing_m: 3.0
  # 128 envs span roughly 33 m. A 3 m/s policy can travel 24 m in one
  # eight-second episode, so 128 m leaves margin around every start origin.
  flat_terrain_size_m: 128.0
  # v178/v179: large triangles caused repeatable position-sensitive falls.
  # Refine only collider triangulation; preserve flat surface and material.
  # Set 0 to reproduce the legacy collider for diagnostics.
  flat_mesh_subdivisions: 5
  # Give the inverted-pendulum controller enough time to leave the reset
  # acceleration transient and produce a measurable steady-speed window.
  episode_length_s: 12.0
  sim_dt: 0.002
  decimation: 4

# Flat-terrain domain randomization follows command proficiency instead of
# wall-clock iterations. Level 29 begins at roughly one tenth of these maxima;
# each successfully gated command level expands the range. Hardware uses
# 5.5 Nm instantaneous peak; 3 Nm is the separate continuous thermal reference.
domain_randomization:
  enabled: true
  apply_in_play: false
  start_command_level: 29
  full_command_level: 46
  # New command skills restart mild DR; final extension reaches full strength.
  # Legacy levels 0–46 retain their exact original schedule.
  extended_start_command_level: 47
  extended_full_command_level: 81
  max_base_mass_fraction: 0.05
  # Extra scalar inertia uncertainty, independent of the mass draw. Opt-in;
  # does not model COM shifts, changing principal-axis ratios, or gimbal reaction.
  max_base_inertia_fraction: 0.0
  max_friction_fraction: 0.15
  max_wheel_damping_fraction: 0.10
  # separated_passive_v1 samples these actual post-clip terms instead of the
  # zero-damping IdealPD wheel actuator. Feedback D stays unbounded by evidence.
  separated_wheel_mechanical_viscous_range: [0.001, 0.005]
  separated_wheel_coulomb_range: [0.001, 0.001]
  separated_wheel_feedback_damping_range: [0.0, 0.0]
  max_wheel_torque_gain_fraction: 0.05
  max_observation_noise_std: 0.01
  max_observation_delay_steps: 1
  max_observation_delay_probability: 0.35
  # Provisional joint-side uncertainty; active with progressive DR strength.
  leg_actuator_enabled: true
  leg_velocity_limit_range_rad_s: [12.0, 17.0]
  leg_armature_range_kg_m2: [0.008, 0.024]
  # Initial engineering bounds, not measured hardware calibration.
  sensor_model:
    enabled: true
    # Independently sampled sensor age and command transport delay, per reset.
    # At sim_dt * decimation = 8 ms, each is 8/16/24 ms at full DR.
    # action_delay_enabled delays all six action channels before actuation.
    # This is NOT an independently calibrated motor response/time-constant model.
    delay_min_steps: 1
    delay_max_steps: 3
    action_delay_enabled: true
    gyro_bias_max_rad_s: 0.02
    gyro_bias_walk_rad_s_sqrt_s: 0.0005
    gyro_noise_std_rad_s: 0.005
    accel_bias_max_mps2: 0.10
    accel_noise_std_mps2: 0.05
    encoder_angle_std_rad: 0.001
    encoder_velocity_std_rad_s: 0.02
    forward_velocity_std_mps: 0.01


# V14-style command layer.  The four actuated channels remain independent so
# the policy can reproduce the left/right sign convention of the physical
# linkage. Passive linkage and guide-wheel drives are explicitly zeroed below.
control:
  firmware_spring_enabled: false
  firmware_spring_target_kp: 60.0
  firmware_spring_scale: 0.10
  # Historical experiments used post-clip D. Deployment-aligned candidates
  # override this to active_motor_v1 and must be retrained under that contract.
  wheel_feedback_damping_mode: postclip_loss_v1
  leg_mode: position
  leg_pair_mapping: independent
  leg_position_scale_rad: 0.35
  stand_leg_position_scale_rad: 0.18
  # Smooth stand -> command transition; the policy never jumps from 0.18 to
  # the full locomotion scale on the first command-stage rollout.
  command_leg_position_scale_mid_rad: 0.22
  command_leg_position_scale_final_rad: 0.28
  wheel_torque_scale_nm: 5.5
  # Authored USD angular drive cap measured by validate_rmuc_usd.py. This is
  # diagnostic metadata only; the immutable USD remains the source of truth
  # and the task actuator contract is not silently rewritten.
  wheel_authored_effort_limit_nm: 3.0
  # Contact-cylinder radius in the reference MuJoCo model.
  wheel_radius_m: 0.060
  # Probe result: positive USD wheel torque moves the canonical body frame in
  # negative forward direction, so both policy wheel channels need inversion.
  wheel_action_sign: [-1.0, -1.0]
  # Low-level yaw-rate feedback supplies only a bounded differential residual.
  # Unlike target-only feedforward, it vanishes at the requested yaw rate.
  wheel_yaw_feedback_action_per_rad_s: 3.60
  # Fixed-policy Level-28 A/B at 2.4 m/s, |yaw|=0.30: clips 0.30/0.20/0.15/0.12
  # caused 20.8/14.3/9.11/7.81% tilt terminations. Clip 0.10 reached 5.21%
  # but missed the yaw gate at 0.0545 rad/s. Use 0.10 and let the directional
  # policy head learn the remaining 0.0045 rad/s yaw correction without consuming the
  # common-mode wheel authority needed to catch pitch.
  wheel_yaw_feedback_action_clip: 0.10
  wheel_yaw_feedback_straight_action_clip: 0.15
  # Current speed-routed expert A/B at Level 8 found -0.020 reduced the worst
  # direction error to 0.180 m/s versus 0.188 at -0.010, with zero tilt or
  # reverse motion. Level 3/4 retests also passed at 1.0 m/s and yaw 0.30/0.45.
  wheel_speed_feedback_action_per_mps: -0.020
  # A 1800-step, 128-env Level-23 A/B with 0.004 action noise found -0.36,
  # pitch-rate gain 0.04 and yaw clip 0.15 jointly passed: 0.149 m/s temporal
  # speed error and 9.11% tilt terminations. The unchanged 0.08 speed clip
  # preserves the maximum common-mode residual.
  wheel_speed_feedback_high_speed_threshold_mps: 1.65
  wheel_speed_feedback_high_speed_action_per_mps: -0.36
  wheel_speed_feedback_action_clip: 0.08
  # The negative high-speed gain is an inverted-pendulum stabilizer while
  # underspeed. Once the robot overshoots, its sign reverses and used to add
  # forward action, creating the Level-17 runaway/fall cycle. At >2.5 m/s,
  # retain the stabilizing branch but do not let this residual propel overspeed.
  wheel_highspeed_feedback_overspeed_action_clip: 0.00
  # The Level-16 actor already balances at 2.5 m/s. Above that speed, provide
  # only the incremental common-mode torque needed to offset the configured
  # wheel damping. At 3.0 m/s this reaches +0.10 action (=0.55 Nm target torque).
  # It is disabled for rehearsal commands and fades out beyond mild overspeed.
  wheel_highspeed_propulsion_start_mps: 2.50
  wheel_highspeed_propulsion_action_per_mps: 0.20
  wheel_highspeed_propulsion_action_clip: 0.10
  wheel_highspeed_propulsion_overspeed_fade_mps: 0.20
  # Keep most of the calibrated inverted-pendulum speed residual while the
  # actuator bridge changes damping. Removing it at the start of the bridge
  # makes an un-certified high-speed actor fall into the low-speed basin before
  # PPO can adapt; the residual still fades only after the student is stable.
  wheel_speed_feedback_damping_anneal_target_scale: 0.85
  # Do not add a direction-specific multiplier: both signs are independently
  # gated, and the weaker +yaw branch receives extra on-policy episode coverage.
  wheel_speed_feedback_negative_turn_scale: 1.00
  # Small sagittal residual for Level-14+ active commands. It keeps the wheels
  # under a forward-leaning chassis without changing low/medium turn replay.
  # The 0.04 action cap is 0.22 Nm at the configured 5.5 Nm wheel scale.
  wheel_pitch_feedback_start_level: 14
  wheel_pitch_feedback_action_per_rad: 0.20
  # Fixed-policy Level-17 A/B: +0.05 pitch-rate feedback passed the 1800-step
  # speed/stability evaluation; +0.10 amplified action noise and increased
  # long-horizon tilt failures. This is chassis-pitch control damping, not
  # wheel-axis damping.
  wheel_pitch_rate_feedback_action_per_rad_s: 0.04
  # Extra derivative action only during a rapid pitch excursion. This leaves
  # normal 0.1-0.2 rad/s balancing untouched and overrides the angle term
  # before a 5+ rad/s terminal pitch divergence.
  wheel_pitch_rate_emergency_threshold_rad_s: 1.00
  wheel_pitch_rate_emergency_action_per_rad_s: 0.00
  wheel_pitch_feedback_action_clip: 0.08
  # Keep recovery active until the safety stop. The previous 0.85 cosine gate
  # switched pitch feedback off beyond 31.8 deg, exactly when a high-speed
  # excursion still needed the wheels to move back under the chassis.
  wheel_pitch_feedback_min_upright_cos: 0.00
  # Keep the checkpoint-compatible actuator dynamics by default. Compensation
  # is diagnostic-only until a policy is explicitly retrained under it; applying
  # it to a v49 actor changes the wheel effort contract and collapses speed.
  wheel_damping_compensation_start_level: 14
  wheel_damping_compensation_ratio: 0.00
  # Smooth support through the target instead of switching torque at zero error.
  # It fades to zero only after material overspeed.
  wheel_damping_compensation_margin_mps: 0.20
  wheel_damping_compensation_scale_mps: 0.40
  # Disabled by default for checkpoint compatibility. High-speed bridge runs
  # enable a target through CLI and cosine-anneal the effective damping while
  # leaving the USD and constructed Isaac actuator unchanged.
  wheel_damping_anneal_target: -1.0
  wheel_damping_anneal_steps: 6000000
  # Let a fresh critic fit the changed reward landscape before actuator
  # dynamics begin moving. At 128 envs this is about 61 PPO iterations with a
  # 128-step rollout and safely exceeds the 50-iteration actor freeze.
  wheel_damping_anneal_warmup_steps: 1000000
  # Start the actuator bridge at the first not-yet-certified large-yaw stage.
  # Direct entry above this level means a checkpoint already completed the
  # bridge, while direct entry at Level 28 correctly starts at damping 0.1.
  wheel_damping_anneal_start_level: 28
  # Advance the bridge only while the current actor is tracking safely. This
  # prevents actuator dynamics from changing faster than PPO can adapt.
  wheel_damping_anneal_adaptive: true
  # The bridge must be allowed to cross the non-monotonic, damping-induced
  # low-speed basin. This is only a reverse-runaway guard; the stage gate below
  # stays at 0.15 m/s and remains authoritative for skill certification.
  wheel_damping_anneal_max_linear_error_mps: 0.30
  wheel_damping_anneal_min_stable_fraction: 0.45
  # Bridge safety threshold only. The curriculum stage still requires 0.95
  # survival before advancement; using that same final threshold here created
  # a deadlock because high damping itself caused the remaining failures.
  wheel_damping_anneal_min_survival_fraction: 0.92
  action_clip: 1.0
  leg_joint_limit_margin_rad: 0.02

command:
  linear_x_mps: 1.00
  yaw_rate_rad_s: 0.30
  # model_1225 is the last full-episode 1.0 m/s checkpoint. Recalibrate its
  # command slot as tracking error at level 0 before introducing yaw.
  start_level: 0
  # Normal curriculum launches interpolate from the previous stage. A
  # checkpoint already trained at the requested level can opt out through the
  # --start_command_at_target CLI flag.
  start_at_target: false
  # Preserve the 25-D policy contract while closing the velocity loop. Legacy
  # checkpoints use slot 7 for lateral error, so their first-layer column 7 must
  # be zeroed once when migrating to the absolute target-speed meaning below.
  # Fixed-policy sweep at 1.5 m/s + 0.10 rad/s: 0.6 produced 1.07 m/s,
  # while 2.1 produced 1.40 m/s with 0.097 m/s temporal error, no torque
  # saturation, low slip, and no terminations. Higher values had little gain.
  observation_scale: [2.10, 0.50, 1.00]
  # Keep the 25-D contract while making mixed-speed control Markov enough for
  # one actor: [vx_error, target_vx, yaw_error]. Error-only observations made
  # 1.0->0.5 and 1.75->1.25 indistinguishable despite requiring different
  # inverted-pendulum feed-forward posture and wheel action.
  observation_mode: tracking_error_with_target
  observation_error_clip: 2.0
  bootstrap_linear_x_mps: 1.00
  bootstrap_yaw_rate_rad_s: 0.0
  bootstrap_leg_scale_rad: 0.22
  # Each level is held and gated independently. Turn signs alternate across
  # environments so a persistent one-sided steering bias cannot pass the gate.
  stages:
    - {name: baseline_1p0_straight, linear_x_mps: 1.00, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.22}
    - {name: baseline_1p0_turn_0p10, linear_x_mps: 1.00, yaw_rate_rad_s: 0.10, leg_scale_rad: 0.22}
    - {name: baseline_1p0_turn_0p20, linear_x_mps: 1.00, yaw_rate_rad_s: 0.20, leg_scale_rad: 0.22}
    - {name: baseline_1p0_turn_0p30, linear_x_mps: 1.00, yaw_rate_rad_s: 0.30, leg_scale_rad: 0.22}
    - {name: baseline_1p0_large_turn_0p45, linear_x_mps: 1.00, yaw_rate_rad_s: 0.45, leg_scale_rad: 0.22}
    - {name: transition_1p5_straight, linear_x_mps: 1.50, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.24}
    - {name: transition_1p5_turn_0p10, linear_x_mps: 1.50, yaw_rate_rad_s: 0.10, leg_scale_rad: 0.24}
    - {name: transition_1p5_turn_0p20, linear_x_mps: 1.50, yaw_rate_rad_s: 0.20, leg_scale_rad: 0.24}
    - {name: recovery_1p5_turn_0p30_strict, linear_x_mps: 1.50, yaw_rate_rad_s: 0.30, leg_scale_rad: 0.24}
    # Earlier loose gates advanced to the nominal 1.5 m/s stages while the
    # deterministic actor only sustained about 1.1 m/s. Recover from measured
    # capability, then ratchet the target in 0.10-0.15 m/s increments.
    - {name: recovery_1p2_straight, linear_x_mps: 1.20, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.24}
    - {name: transition_1p35_straight, linear_x_mps: 1.35, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.24}
    - {name: transition_1p5_straight_strict, linear_x_mps: 1.50, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.24}
    - {name: transition_1p6_straight, linear_x_mps: 1.60, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.242}
    - {name: transition_1p75_straight, linear_x_mps: 1.75, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.245}
    # Give the actor and rebuilt reward critic enough updates to learn the
    # non-minimum-phase pitch/drive sequence instead of forcing 1.75->2.0 in 31
    # iterations at 128x128 rollout throughput.
    - {name: transition_2p0_straight, linear_x_mps: 2.00, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.25, transition_steps: 2000000}
    # At 2.0 m/s, 0.25 rad/s gives 0.50 m/s^2 lateral acceleration and an
    # 8 m turn radius: slightly harder than the 1.5 m/s, 0.30 rad/s turn.
    # Level 15 is certified only inside 1.9-2.1 m/s. Earlier high-speed
    # straight stages keep the shared 0.20 m/s acquisition gate.
    - {name: transition_2p0_large_turn_0p25, linear_x_mps: 2.00, yaw_rate_rad_s: 0.25, leg_scale_rad: 0.25, transition_steps: 1000000, advance_linear_error_mps: 0.10}
    # Keep actuator dynamics fixed while learning the next speed. A long ramp
    # avoids combining a 0.5 m/s command jump with the removal of Level-15 yaw.
    - {name: transition_2p5_straight, linear_x_mps: 2.50, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.265, transition_steps: 2000000}
    # Give the actor roughly 122 updates at 128 envs x 128 rollout steps to
    # adapt from 2.5 to 3.0 m/s. The default 500k transition gives only about
    # 31 updates and changes the target faster than the high-speed actor adapts.
    - {name: high_3p0_straight, linear_x_mps: 3.00, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.28, transition_steps: 2000000, survival_gate_steps: 800}
    # Re-enter the certified 2.0 m/s turning basin before extending the speed
    # envelope. This stage raises yaw from the retained 0.25 rad/s skill to the
    # requested 0.30 rad/s and must pass both turn signs independently.
    - {name: reinforce_2p0_bank_turn_0p30, linear_x_mps: 2.00, yaw_rate_rad_s: 0.30, leg_scale_rad: 0.25, transition_steps: 1000000, advance_linear_error_mps: 0.10}
    # Certify every 0.1 m/s bucket rather than treating 2.5 -> 3.2 m/s as one
    # skill. Each stage gets its own transition, final-command hold, complete
    # episode survival gate, and retained-skill gate.
    - {name: recert_2p5_straight, linear_x_mps: 2.50, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.265, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: high_2p6_straight, linear_x_mps: 2.60, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.268, transition_steps: 500000, advance_linear_error_mps: 0.15}
    - {name: high_2p7_straight, linear_x_mps: 2.70, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.270, transition_steps: 500000, advance_linear_error_mps: 0.15}
    - {name: high_2p8_straight, linear_x_mps: 2.80, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.273, transition_steps: 500000, advance_linear_error_mps: 0.15}
    - {name: high_2p9_straight, linear_x_mps: 2.90, yaw_rate_rad_s: 0.0, leg_scale_rad: 0.276, transition_steps: 500000, advance_linear_error_mps: 0.15}
    # Densely cover sub-3 m/s cornering. Adjacent speed anchors are at most
    # 0.2 m/s apart (0.1 m/s from the nearest anchor), and both yaw magnitudes
    # must pass independently in both turn directions.
    - {name: bank_2p0_turn_0p15, linear_x_mps: 2.00, yaw_rate_rad_s: 0.15, leg_scale_rad: 0.250, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: bank_2p2_turn_0p15, linear_x_mps: 2.20, yaw_rate_rad_s: 0.15, leg_scale_rad: 0.255, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: bank_2p2_turn_0p30, linear_x_mps: 2.20, yaw_rate_rad_s: 0.30, leg_scale_rad: 0.255, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: bank_2p4_turn_0p15, linear_x_mps: 2.40, yaw_rate_rad_s: 0.15, leg_scale_rad: 0.262, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: bank_2p4_turn_0p30, linear_x_mps: 2.40, yaw_rate_rad_s: 0.30, leg_scale_rad: 0.262, transition_steps: 1000000, advance_linear_error_mps: 0.15}
    - {name: bank_2p5_turn_0p15, linear_x_mps: 2.50, yaw_rate_rad_s: 0.15, leg_scale_rad: 0.265, transition_steps: 1000000, advance_linear_error_mps: 0.15}
